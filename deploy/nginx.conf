# /etc/nginx/sites-available/dhruv-portfolio
# Reverse proxy -> Next.js on 127.0.0.1:3000
# After this is in place, run certbot to inject the SSL block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;  # <-- change

    # Let certbot manage the redirect; until then serve over 80.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Long-cache the immutable Next static assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
